foresight: myopic

countries: [BN, KH, ID, LA, MY, MM, PH, SG, TH, VN]

enable:
  retrieve_databundle: false 
  retrieve_databundle_sector: false
  retrieve_cost_data: false 
  download_osm_data: false 
  build_natura_raster: false 
  build_cutout: false

scenario:
  ll: ["copt"] 
  clusters: [105]
  planning_horizons: 
  - 2030
  - 2050  # 2040 needs NZ data
  demand: #Net Zero
  - "NZ"
  opts: [EQ0.8c-3h] #CO2 limit, 3H, 80% self sufficiency
  sopts:
  - "3h"

snapshots:
  start: "2018-01-01"
  end: "2018-02-01"

cluster_options:
  simplify_network:
    remove_stubs: false
    remove_stubs_across_borders: false
    p_threshold_drop_isolated: 0 
    p_threshold_merge_isolated: 0 
    s_threshold_fetch_isolated: 0.1 
  #alternative_clustering: true

