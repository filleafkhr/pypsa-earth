electricity:
  co2limit: 1e+9 #1e+9 20% #AEO6
  use_relative_targets: true
  co2_relative_targets:
    2030: 2.5 #1.8504  # 2,215.2 Mt CO2-eq in 2022
    2035: 2
    2040: 1.5
    2045: 1
    2050: 0.5
  powerplants_filter: "(DateOut >= 2030) or (DateOut != DateOut)" 
  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT]
    StorageUnit: [battery, H2] 
    Store: [battery, H2]


