  planning_horizons: 
  - 2030
  - 2035
  - 2040
  - 2045  
  - 2050  
  demand: 
  - "ASEAN"
  opts: [Co2L-3h] #Co2L-EQ0.8c- CO2 limit, 1H, 80% self sufficiency
