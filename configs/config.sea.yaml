electricity:
#Fillea todo
  co2limit: 1e+50 #1e+9 #AEO6
  use_relative_targets: false
  co2_relative_targets:
    2030: 0.20  
    2035: 0.40
    2040: 0.60
    2045: 0.80 
    2050: 1.0
  #automatic_emission: true  # COULDD BE WHY INFEASIBLE
  powerplants_filter: (DateOut >= 2050 or DateOut != DateOut)
  operational_reserve: 
    activate: false 
    epsilon_load: 0.025 
    epsilon_vres: 0.025 
  extendable_carriers:
    Generator: [solar, onwind, offwind-ac, offwind-dc, OCGT, CCGT]
    StorageUnit: [battery, H2] 
    Store: [battery, H2]


lines:
  s_nom_max: 2

links:
  p_nom_max: 2

costs: 
  year: 2050
  discountrate: [0.05] 
  #Fillea todo : No data available for SEA 
  marginal_cost: # EUR/MWh
    solar: 0.
    onwind: 0.
    offwind: 0.
    hydro: 0.  #4.68 USD/MWh
    H2: 0. 
    electrolysis: 0.
    fuel cell: 0.
    battery: 0.
    battery inverter: 0.
  emission_prices: # in currency per tonne emission, only used with the option Ep
    co2: 0.
  
fossil_reserves:
  oil: 19212.76 #TWh 11.8 billion bbo
export:
  endogenous: false # COULDD BE WHY INFEASIBLE
  h2export: [0] #demand in twh
  #store_capital_costs: "standard_costs" # ["standard_costs", "no_costs"] # specifies the costs of the export store. "standard_costs" takes CAPEX of "hydrogen storage tank type 1 including compressor"

custom_data: #look for datac
  gas_network: true # used osm data as placeholder 


sector:
  gas:
    spatial_gas: true 
    network: false 
  hydrogen:
    network: false
    network_routes: greenfield 
    gas_network_repurposing: false 
    underground_storage: true  
  #AMS target scenario
  land_transport_fuel_cell_share:
    ASEAN_2030: 0.00 
    ASEAN_2035: 0.000225
    ASEAN_2040: 0.000450
    ASEAN_2045: 0.000675
    ASEAN_2050: 0.0009 #0.09% in transport share 
  land_transport_electric_share:
    ASEAN_2030: 0.014 
    ASEAN_2035: 0.029
    ASEAN_2040: 0.044
    ASEAN_2045: 0.059
    ASEAN_2050: 0.074
  shipping_hydrogen_share:
    ASEAN_2030: 0.00 
    ASEAN_2035: 0.000225
    ASEAN_2040: 0.000450
    ASEAN_2045: 0.000675
    ASEAN_2050: 0.0009 #0.09% in transport share 
  co2_network: false 
  biomass_transport: false
  solid_biomass_potential: 1089 # TWh/a, 10% from biomass residues 
  biogas_potential: 0.4356 # TWh/a, 10% only from lifestock manure (4% of total residue)
  co2_sequestration_potential: 120 #MtCO2/a sequestration potential in 2050 
  co2_sequestration_cost: 37.66 #EUR/tCO2 for sequestration of CO2, ASEAN max=450$/Ton
  shipping_hydrogen_liquefaction: false
  space_heat_share: 0
